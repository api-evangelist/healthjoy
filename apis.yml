aid: healthjoy
name: HealthJoy
description: 'HealthJoy is a Chicago-based employee-benefits engagement, healthcare
  navigation, and cost-containment platform founded in 2014, which markets itself as
  a "Benefits Operating System" (BOS) for employers and benefit consultants. It unifies
  fragmented health benefits into a single member-facing app combining Joy AI — a 24/7
  AI assistant trained on each client''s benefits plan — with a licensed human healthcare
  concierge team, provider search with cost scores and quality ratings, prescription
  savings, medical bill review, and an intelligent steerage engine that routes members
  to high-value, fair-priced care. Employers and consultants get a client dashboard
  reporting engagement, utilization, savings, and ROI. HealthJoy reports 1,800+ client
  companies and 1.25M+ members. It publishes no public developer API, developer portal,
  or machine-readable API contract; integrations with benefits-administration and TPA
  vendors (e.g. Employee Navigator) are delivered as managed eligibility/census data
  feeds set up by its implementation team rather than as a self-serve API.'
