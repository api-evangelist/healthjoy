scope: >-
  HealthJoy publishes no machine-readable API contract, so no API-level standards
  (OAuth2/OIDC, RFC 9457, JSON:API, pagination, idempotency) can be asserted or
  derived. What follows is the platform/regulatory compliance posture HealthJoy
  states publicly on its Privacy & Security page, plus explicit negatives for the
  healthcare interoperability standards a benefits/navigation platform might be
  expected to carry.
standards:
- id: soc2-type-ii
  conforms: true
  evidence: >-
    "HealthJoy has achieved the Type II SOC 2 attestation — an annual third-party
    audit that affirms how securely we manage and process your data."
  source: https://www.healthjoy.com/privacy-security
- id: hipaa
  conforms: true
  evidence: >-
    "We are compliant with applicable federal privacy laws including the Health
    Insurance Portability and Accountability Act (HIPAA), which has strict
    guidelines on how to handle health data." A Notice of HIPAA Privacy Practices
    is published at /hipaa; "Every employee undergoes extensive HIPAA training."
  source: https://www.healthjoy.com/hipaa
- id: pci-dss
  conforms: partial
  evidence: >-
    Not certified directly — payment handling is delegated. "Medical consultation
    fees are processed through Stripe, a PCI Service Provider Level 1... HealthJoy
    never stores your financial information on our servers."
  source: https://www.healthjoy.com/privacy-security
