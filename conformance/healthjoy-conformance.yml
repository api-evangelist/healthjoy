- id: fhir-r4
  conforms: false
  evidence: >-
    No FHIR claim, no FHIR endpoint, no CapabilityStatement. HealthJoy is a
    benefits-navigation layer, not a clinical data exchange; provider/claims data
    reaches it via managed eligibility feeds from benefits-admin and TPA partners.
